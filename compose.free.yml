services:
  llm:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models-cache
    command:
      - -hf
      - ggml-org/Qwen3-1.7B-GGUF:Q4_K_M
      - --jinja
      - --alias
      - qwen3-1.7b-local
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --parallel
      - "1"
      - --threads
      - "2"
    expose:
      - "8080"
    volumes:
      - llm_models:/models-cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 3g
    cpus: 2

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: votoclaro
      POSTGRES_USER: votoclaro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votoclaro -d votoclaro"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.free
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://votoclaro:${POSTGRES_PASSWORD}@db:5432/votoclaro
      DATABASE_SSL: "false"
      DATA_DIR: /data
      PHOTO_DIR: /data/photos
      PUBLIC_BASE_URL: https://${SITE_HOST}
      LOCAL_LLM_ENABLED: "true"
      LOCAL_LLM_BASE_URL: http://llm:8080/v1
      LOCAL_LLM_MODEL: qwen3-1.7b-local
    volumes:
      - ./data-production:/data
    depends_on:
      db:
        condition: service_healthy
      llm:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(![200,503].includes(r.status))process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_HOST: ${SITE_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/oci/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  llm_models:
