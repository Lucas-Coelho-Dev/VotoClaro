services:
  llm:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models-cache
    command: ["-hf", "ggml-org/Qwen3-1.7B-GGUF:Q4_K_M", "--jinja", "--alias", "qwen3-1.7b-local", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "4096", "--parallel", "1", "--threads", "2"]
    expose: ["8080"]
    volumes: [llm_models:/models-cache]
    networks: [private_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 3g
    cpus: 2

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: votoclaro
      POSTGRES_USER: votoclaro
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [private_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votoclaro -d votoclaro"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: [.env.free]
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: db
      DATABASE_USER: votoclaro
      DATABASE_NAME: votoclaro
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_SSL: "false"
      DATA_DIR: /data
      PHOTO_DIR: /data/photos
      PUBLIC_BASE_URL: https://${SITE_HOST}
      LOCAL_LLM_ENABLED: "true"
      AI_WORKER_AVAILABLE: "true"
      LOCAL_LLM_BASE_URL: http://llm:8080/v1
      LOCAL_LLM_MODEL: qwen3-1.7b-local
      SYNC_ON_START: "false"
      SYNC_SCHEDULER_ENABLED: "false"
      BACKGROUND_ANALYSIS_ENABLED: "false"
      SYNC_SECRET_FILE: /run/secrets/sync_secret
      ADMIN_SECRET_FILE: /run/secrets/admin_secret
      PORTAL_TRANSPARENCIA_TOKEN_FILE: /run/secrets/portal_transparencia_token
      DATAJUD_API_KEY_FILE: /run/secrets/datajud_api_key
      GOOGLE_FACT_CHECK_API_KEY_FILE: /run/secrets/google_fact_check_api_key
    secrets: [postgres_password, sync_secret, admin_secret, portal_transparencia_token, datajud_api_key, google_fact_check_api_key]
    expose: ["3000"]
    volumes: [./data-production:/data]
    networks: [public_net, private_net]
    depends_on:
      db: { condition: service_healthy }
      llm: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(![200,503].includes(r.status))process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 1500m
    cpus: 1.5
    security_opt: [no-new-privileges:true]

  sync-worker:
    build: .
    command: ["node", "scripts/run-sync-worker.js"]
    restart: unless-stopped
    env_file: [.env.free]
    environment:
      NODE_ENV: production
      DATABASE_HOST: db
      DATABASE_USER: votoclaro
      DATABASE_NAME: votoclaro
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_SSL: "false"
      DATA_DIR: /data
      PHOTO_DIR: /data/photos
      SYNC_ON_START: "false"
      SYNC_SCHEDULER_ENABLED: "false"
      LOCAL_LLM_ENABLED: "false"
    secrets: [postgres_password]
    volumes: [./data-production:/data]
    networks: [private_net]
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 2g
    cpus: 2
    security_opt: [no-new-privileges:true]

  ai-worker:
    build: .
    command: ["node", "scripts/run-ai-worker.js"]
    restart: unless-stopped
    env_file: [.env.free]
    environment:
      NODE_ENV: production
      DATABASE_HOST: db
      DATABASE_USER: votoclaro
      DATABASE_NAME: votoclaro
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_SSL: "false"
      DATA_DIR: /data
      PHOTO_DIR: /data/photos
      SYNC_ON_START: "false"
      SYNC_SCHEDULER_ENABLED: "false"
      LOCAL_LLM_ENABLED: "true"
      AI_WORKER_AVAILABLE: "true"
      LOCAL_LLM_BASE_URL: http://llm:8080/v1
      LOCAL_LLM_MODEL: qwen3-1.7b-local
      BACKGROUND_ANALYSIS_ENABLED: "true"
    secrets: [postgres_password]
    volumes: [./data-production:/data]
    networks: [private_net]
    depends_on:
      db: { condition: service_healthy }
      llm: { condition: service_started }
    mem_limit: 2g
    cpus: 2
    security_opt: [no-new-privileges:true]

  backup-worker:
    image: postgres:16-alpine
    command: ["/opt/votoclaro/backup-loop.sh"]
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: votoclaro
      PGDATABASE: votoclaro
      PGPASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_DIR: /backups
      SOURCE_DATA_DIR: /source-data
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      RESTORE_TEST_INTERVAL_DAYS: ${RESTORE_TEST_INTERVAL_DAYS:-7}
    secrets: [postgres_password]
    volumes:
      - ./deploy/oci/backup-loop.sh:/opt/votoclaro/backup-loop.sh:ro
      - ./deploy/oci/backup-now.sh:/opt/votoclaro/backup-now.sh:ro
      - ./deploy/oci/restore-test.sh:/opt/votoclaro/restore-test.sh:ro
      - ./data-production:/source-data:ro
      - ./backups-production:/backups
    networks: [private_net]
    depends_on:
      db: { condition: service_healthy }
    security_opt: [no-new-privileges:true]

  monitor-worker:
    build: .
    command: ["node", "scripts/run-monitor.js"]
    restart: unless-stopped
    environment:
      MONITOR_HEALTH_URL: http://app:3000/api/v1/health
      MONITOR_STATUS_FILE: /monitor/status.json
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-300}
      MONITOR_DISK_WARNING_PERCENT: ${MONITOR_DISK_WARNING_PERCENT:-80}
      MONITOR_BACKUP_MAX_AGE_HOURS: ${MONITOR_BACKUP_MAX_AGE_HOURS:-30}
      BACKUP_DIR: /backups
    volumes:
      - ./backups-production:/backups:ro
      - monitor_status:/monitor
    networks: [public_net]
    mem_limit: 128m
    cpus: 0.25
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/oci/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv/public:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [public_net]

secrets:
  postgres_password: { file: ./secrets/postgres_password.txt }
  sync_secret: { file: ./secrets/sync_secret.txt }
  admin_secret: { file: ./secrets/admin_secret.txt }
  portal_transparencia_token: { file: ./secrets/portal_transparencia_token.txt }
  datajud_api_key: { file: ./secrets/datajud_api_key.txt }
  google_fact_check_api_key: { file: ./secrets/google_fact_check_api_key.txt }

networks:
  public_net:
  private_net:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  llm_models:
  monitor_status:
